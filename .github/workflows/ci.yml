name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: License audit
        run: pnpm license:audit

      - name: Dependency audit
        run: |
          pnpm audit
          pnpm --dir docker/migrate audit --prod

      - name: Create test database
        run: psql "postgresql://ci:ci@localhost:5432/ci" -c "CREATE DATABASE ci_test;"

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations (dev + test databases)
        run: |
          pnpm db:deploy
          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Lint (strict)
        run: pnpm lint:strict

      - name: Tests
        run: pnpm test

      - name: Developer configuration preflight (not local release approval)
        run: pnpm deployment:preflight

      - name: Build
        run: pnpm build

      - name: Generate dependency SBOM
        if: always()
        run: |
          pnpm run sbom -- --release --output artifacts/worldloom-sbom.cdx.json
          pnpm run sbom -- --release --role migration --output artifacts/worldloom-migrate-sbom.cdx.json

      - name: Validate dependency SBOM against pinned CycloneDX schema
        if: always()
        run: |
          node scripts/validate-sbom.mjs artifacts/worldloom-sbom.cdx.json > artifacts/worldloom-sbom-schema.json
          node scripts/validate-sbom.mjs artifacts/worldloom-migrate-sbom.cdx.json > artifacts/worldloom-migrate-sbom-schema.json

      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worldloom-sbom-${{ github.sha }}
          path: |
            artifacts/worldloom-sbom.cdx.json
            artifacts/worldloom-sbom-schema.json
            artifacts/worldloom-migrate-sbom.cdx.json
            artifacts/worldloom-migrate-sbom-schema.json
          if-no-files-found: error
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Build (E2E runs against the production server)
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          setsid pnpm start > e2e-server.log 2>&1 < /dev/null &
          echo $! > e2e-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4310/api/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat e2e-server.log
          exit 1

      - name: E2E (real browser journeys)
        env:
          E2E_BASE_URL: http://localhost:4310
        run: |
          pnpm e2e e2e/manuscript-and-evals.spec.ts
          pnpm e2e e2e/command-palette.spec.ts
          pnpm e2e e2e/missing-world.spec.ts
          pnpm e2e e2e/sidebar-navigation.spec.ts
          pnpm e2e e2e/world-journey.spec.ts

      - name: UI acceptance (visual and interaction evidence)
        run: |
          shot_output="$(node scripts/ui-shots.mjs http://localhost:4310)"
          printf '%s\n' "$shot_output"
          world_id="$(printf '%s\n' "$shot_output" | sed -n 's/^WORLD_ID=//p' | tail -n 1)"
          test -n "$world_id"
          node scripts/ui-acceptance.mjs http://localhost:4310 "$world_id"

      - name: Full API and page audit
        run: pnpm run audit http://localhost:4310

      - name: Upload UI evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-acceptance-evidence
          path: screenshots/
          retention-days: 7

      - name: Stop production server
        if: always()
        run: |
          if [ -f e2e-server.pid ]; then
            kill -- -"$(cat e2e-server.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Compose graph
        run: docker compose --profile full config --quiet

      - name: Build migration image
        run: |
          version=$(node -p "require('./package.json').version")
          docker build --target migrate --build-arg VCS_REF="$GITHUB_SHA" --build-arg VERSION="$version" --tag worldloom-migrate:ci .

      - name: Verify minimal non-root migration runtime
        run: |
          docker run --rm --network none --read-only \
            --volume "$PWD/scripts/verify-migration-runtime.mjs:/tmp/verify-migration-runtime.mjs:ro" \
            --entrypoint node worldloom-migrate:ci \
            /tmp/verify-migration-runtime.mjs

      - name: Verify migration image legal payload
        run: |
          docker run --rm --network none --read-only \
            --volume "$PWD/scripts/verify-image-payload.mjs:/tmp/verify-image-payload.mjs:ro" \
            --volume "$PWD/scripts/font-assets-audit.mjs:/tmp/font-assets-audit.mjs:ro" \
            --entrypoint node worldloom-migrate:ci \
            /tmp/verify-image-payload.mjs /app --project-license-only

      - name: Build production image
        run: |
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version=$(node -p "require('./package.json').version")
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" \
            --build-arg VERSION="$version" \
            --tag worldloom:ci .
          for image in worldloom:ci worldloom-migrate:ci; do
            revision=$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
            image_version=$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")
            test "$revision" = "$GITHUB_SHA"
            test "$image_version" = "$version"
          done

      - name: Verify production image identity and legal/secret payload
        run: |
          set -eu
          image_user="$(docker image inspect --format '{{.Config.User}}' worldloom:ci)"
          test "$image_user" = "65532:65532"
          docker run --rm --network none --read-only \
            --volume "$PWD/scripts/verify-image-payload.mjs:/tmp/verify-image-payload.mjs:ro" \
            --volume "$PWD/scripts/font-assets-audit.mjs:/tmp/font-assets-audit.mjs:ro" \
            --entrypoint /nodejs/bin/node worldloom:ci \
            /tmp/verify-image-payload.mjs /app
          docker run --rm --entrypoint /nodejs/bin/node worldloom:ci -e '
            const fs = require("node:fs");
            const path = require("node:path");
            if (process.getuid() !== 65532) throw new Error("production image is not running as UID 65532");
            function inspect(directory) {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                if (/^\.env/.test(entry.name)) throw new Error("dotenv file found in image: " + path.join(directory, entry.name));
                if (entry.isDirectory()) inspect(path.join(directory, entry.name));
              }
            }
            inspect("/app");
          '

      - name: Prepare security evidence directory
        run: mkdir -p artifacts

      - name: Audit Debian and Node base-image copyright payloads
        run: |
          docker run --rm --network none --read-only \
            --volume "$PWD/scripts/base-image-copyright-audit.mjs:/tmp/base-image-copyright-audit.mjs:ro" \
            --entrypoint node worldloom-migrate:ci \
            /tmp/base-image-copyright-audit.mjs / --strict --node-runtime \
            > artifacts/worldloom-migrate-base-copyright.json
          docker run --rm --network none --read-only \
            --volume "$PWD/scripts/base-image-copyright-audit.mjs:/tmp/base-image-copyright-audit.mjs:ro" \
            --entrypoint /nodejs/bin/node worldloom:ci \
            /tmp/base-image-copyright-audit.mjs / --strict --node-runtime \
            > artifacts/worldloom-base-copyright.json

      - name: Audit migration runtime license payload
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' worldloom-migrate:ci)"
          docker image inspect "$image_id" > artifacts/worldloom-migrate-image-inspect.json
          docker run --rm --network none --read-only \
            --volume "$PWD/scripts/runtime-license-audit.mjs:/tmp/runtime-license-audit.mjs:ro" \
            --entrypoint node "$image_id" \
            /tmp/runtime-license-audit.mjs /app --strict --image-id "$image_id" \
            > artifacts/worldloom-migrate-runtime-licenses.json

      - name: Audit production runtime license payload (release gate)
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' worldloom:ci)"
          docker run --rm --network none --read-only \
            --volume "$PWD/scripts/runtime-license-audit.mjs:/tmp/runtime-license-audit.mjs:ro" \
            --entrypoint /nodejs/bin/node "$image_id" \
            /tmp/runtime-license-audit.mjs /app --strict --image-id "$image_id" \
            > artifacts/worldloom-runtime-licenses.json

      - name: Upload runtime license evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worldloom-runtime-licenses-${{ github.sha }}
          path: |
            artifacts/worldloom-migrate-runtime-licenses.json
            artifacts/worldloom-runtime-licenses.json
            artifacts/worldloom-migrate-base-copyright.json
            artifacts/worldloom-base-copyright.json
          if-no-files-found: warn

      - name: Scan production image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: worldloom:ci
          format: json
          output: artifacts/worldloom-trivy.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          version: v0.74.0
          exit-code: '1'

      - name: Upload vulnerability scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worldloom-vulnerability-scan-${{ github.sha }}
          path: artifacts/worldloom-trivy.json
          if-no-files-found: error
          retention-days: 30

      - name: Export production image for signed provenance
        if: github.event_name == 'push'
        run: |
          mkdir -p artifacts
          docker save worldloom:ci --output artifacts/worldloom-image.tar
          sha256sum artifacts/worldloom-image.tar > artifacts/worldloom-image.tar.sha256

      - name: Generate signed build provenance
        if: github.event_name == 'push'
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/worldloom-image.tar

      - name: Retain signed build provenance bundle
        if: github.event_name == 'push'
        run: cp "${{ steps.provenance.outputs.bundle-path }}" artifacts/worldloom-build-provenance.json

      - name: Download dependency SBOM for signed attestation
        if: github.event_name == 'push'
        uses: actions/download-artifact@v7
        with:
          name: worldloom-sbom-${{ github.sha }}
          path: artifacts/sbom

      - name: Generate signed SBOM attestation
        if: github.event_name == 'push'
        id: sbom_attestation
        uses: actions/attest@v4
        with:
          subject-path: artifacts/worldloom-image.tar
          sbom-path: artifacts/sbom/worldloom-sbom.cdx.json

      - name: Retain signed SBOM attestation bundle
        if: github.event_name == 'push'
        run: cp "${{ steps.sbom_attestation.outputs.bundle-path }}" artifacts/worldloom-sbom-attestation.json

      - name: Upload signed provenance evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: worldloom-provenance-${{ github.sha }}
          path: |
            artifacts/worldloom-image.tar
            artifacts/worldloom-image.tar.sha256
            artifacts/worldloom-build-provenance.json
            artifacts/worldloom-sbom-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Capture immutable image metadata
        if: always()
        run: |
          mkdir -p artifacts
          docker image inspect worldloom:ci > artifacts/worldloom-image-inspect.json

      - name: Upload image metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worldloom-image-metadata-${{ github.sha }}
          path: |
            artifacts/worldloom-image-inspect.json
            artifacts/worldloom-migrate-image-inspect.json
          if-no-files-found: error
          retention-days: 30

      - name: Full Compose runtime smoke test
        run: |
          set -eu
          worker_ids=""
          restore_workers() {
            for worker_id in $worker_ids; do
              running="$(docker inspect --format '{{.State.Running}}' "$worker_id" 2>/dev/null || true)"
              if [ "$running" = false ]; then docker start "$worker_id" >/dev/null; fi
            done
          }
          cleanup() {
            restore_workers
            docker compose --profile full down -v --remove-orphans
          }
          trap cleanup EXIT
          docker compose --profile full up -d --build --scale worker=2
          for attempt in $(seq 1 60); do
            app_id="$(docker compose --profile full ps -q app)"
            worker_ids="$(docker compose --profile full ps -q worker)"
            app_status="$(docker inspect --format '{{.State.Health.Status}}' "$app_id" 2>/dev/null || true)"
            worker_count="$(printf '%s\n' "$worker_ids" | sed '/^$/d' | wc -l | tr -d ' ')"
            unhealthy_workers=0
            for worker_id in $worker_ids; do
              worker_status="$(docker inspect --format '{{.State.Health.Status}}' "$worker_id" 2>/dev/null || true)"
              if [ "$worker_status" != healthy ]; then
                unhealthy_workers=$((unhealthy_workers + 1))
              fi
            done
            if [ "$app_status" = healthy ] && [ "$worker_count" = 2 ] && [ "$unhealthy_workers" = 0 ]; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose --profile full ps
              docker compose --profile full logs --no-color --tail=120
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4310/api/health/ready

          app_id="$(docker compose --profile full ps -q app)"
          worker_ids="$(docker compose --profile full ps -q worker)"
          worker_1="$(printf '%s\n' "$worker_ids" | sed -n '1p')"
          worker_2="$(printf '%s\n' "$worker_ids" | sed -n '2p')"
          assert_runtime_hardening() {
            service="$1"
            container_id="$2"
            user="$(docker inspect --format '{{.Config.User}}' "$container_id")"
            read_only="$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")"
            cap_drop="$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id")"
            security_opt="$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container_id")"
            pids_limit="$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$container_id")"
            test "$user" = "65532:65532"
            test "$read_only" = "true"
            test "$pids_limit" = "256"
            case "$cap_drop" in *'"ALL"'*) ;; *) echo "$service did not drop all capabilities: $cap_drop"; exit 1 ;; esac
            case "$security_opt" in *'no-new-privileges:true'*) ;; *) echo "$service lacks no-new-privileges: $security_opt"; exit 1 ;; esac
            printf 'service=%s container=%s user=%s readonlyRootfs=%s capDrop=%s securityOpt=%s pidsLimit=%s\n' \
              "$service" "$container_id" "$user" "$read_only" "$cap_drop" "$security_opt" "$pids_limit" \
              >> artifacts/worldloom-runtime-hardening.txt
          }
          mkdir -p artifacts
          : > artifacts/worldloom-runtime-hardening.txt
          assert_runtime_hardening app "$app_id"
          assert_runtime_hardening worker "$worker_1"
          assert_runtime_hardening worker "$worker_2"
          for selected_worker in "$worker_1" "$worker_2"; do
            if [ "$selected_worker" = "$worker_1" ]; then other_worker="$worker_2"; else other_worker="$worker_1"; fi
            docker stop "$other_worker" >/dev/null
            selected_number="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.container-number"}}' "$selected_worker")"
            selected_health=""
            for health_attempt in $(seq 1 30); do
              selected_health="$(docker inspect --format '{{.State.Health.Status}}' "$selected_worker" 2>/dev/null || true)"
              if [ "$selected_health" = healthy ]; then break; fi
              sleep 2
            done
            if [ "$selected_health" != healthy ]; then
              echo "worker replica $selected_number is not healthy: $selected_health"
              exit 1
            fi
            echo "Probing isolated worker replica $selected_number ($selected_worker)"
            docker exec -i "$app_id" /nodejs/bin/node - < scripts/worker-replica-claim-smoke.mjs
            docker start "$other_worker" >/dev/null
          done
          restore_workers
          docker compose --profile full ps

      - name: Upload runtime hardening evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worldloom-runtime-hardening-${{ github.sha }}
          path: artifacts/worldloom-runtime-hardening.txt
          if-no-files-found: warn
          retention-days: 30

  evidence:
    if: needs.verify.result == 'success' && needs.e2e.result == 'success' && needs.container.result == 'success'
    needs: [verify, e2e, container]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download dependency SBOM
        uses: actions/download-artifact@v7
        with:
          name: worldloom-sbom-${{ github.sha }}
          path: evidence/sbom

      - name: Download image metadata
        uses: actions/download-artifact@v7
        with:
          name: worldloom-image-metadata-${{ github.sha }}
          path: evidence/image

      - name: Download runtime inventory
        uses: actions/download-artifact@v7
        with:
          name: worldloom-runtime-licenses-${{ github.sha }}
          path: evidence/runtime

      - name: Download vulnerability scan evidence
        uses: actions/download-artifact@v7
        with:
          name: worldloom-vulnerability-scan-${{ github.sha }}
          path: evidence/vulnerability

      - name: Download signed provenance evidence
        if: github.event_name == 'push'
        uses: actions/download-artifact@v7
        with:
          name: worldloom-provenance-${{ github.sha }}
          path: evidence/provenance

      - name: Verify signed build provenance
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify evidence/provenance/worldloom-image.tar \
            --bundle evidence/provenance/worldloom-build-provenance.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "refs/heads/main" \
            --format json > evidence/provenance/verification.json

      - name: Verify signed SBOM attestation
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify evidence/provenance/worldloom-image.tar \
            --bundle evidence/provenance/worldloom-sbom-attestation.json \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type "https://cyclonedx.org/bom" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "refs/heads/main" \
            --format json > evidence/provenance/sbom-verification.json

      - name: Correlate release evidence
        run: |
          provenance_args=()
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            provenance_args+=(
              --provenance evidence/provenance/verification.json
              --provenance-artifact evidence/provenance/worldloom-image.tar
              --sbom-provenance evidence/provenance/sbom-verification.json
            )
          fi
          node scripts/verify-build-evidence.mjs \
            --revision "$GITHUB_SHA" \
            --sbom evidence/sbom/worldloom-sbom.cdx.json \
            --image evidence/image/worldloom-image-inspect.json \
            --runtime-inventory evidence/runtime/worldloom-runtime-licenses.json \
            --vulnerability-report evidence/vulnerability/worldloom-trivy.json \
            "${provenance_args[@]}" \
            --output evidence/index.json
          node scripts/verify-build-evidence.mjs \
            --role migration \
            --revision "$GITHUB_SHA" \
            --sbom evidence/sbom/worldloom-migrate-sbom.cdx.json \
            --image evidence/image/worldloom-migrate-image-inspect.json \
            --runtime-inventory evidence/runtime/worldloom-migrate-runtime-licenses.json \
            --output evidence/migration-index.json

      - name: Upload correlated evidence index
        uses: actions/upload-artifact@v7
        with:
          name: worldloom-evidence-index-${{ github.sha }}
          path: |
            evidence/index.json
            evidence/migration-index.json
          if-no-files-found: error
          retention-days: 30
