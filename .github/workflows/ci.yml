name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: License audit
        run: pnpm license:audit

      - name: Dependency audit
        run: pnpm audit

      - name: Create test database
        run: psql "postgresql://ci:ci@localhost:5432/ci" -c "CREATE DATABASE ci_test;"

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations (dev + test databases)
        run: |
          pnpm db:deploy
          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Lint (strict)
        run: pnpm lint:strict

      - name: Tests
        run: pnpm test

      - name: Deployment preflight (local contract)
        run: pnpm deployment:preflight

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Build (E2E runs against the production server)
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          setsid pnpm start > e2e-server.log 2>&1 < /dev/null &
          echo $! > e2e-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4310/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat e2e-server.log
          exit 1

      - name: E2E (real browser journeys)
        env:
          E2E_BASE_URL: http://localhost:4310
        run: |
          pnpm e2e e2e/manuscript-and-evals.spec.ts
          pnpm e2e e2e/world-journey.spec.ts

      - name: UI acceptance (visual and interaction evidence)
        run: |
          node scripts/ui-shots.mjs http://localhost:4310
          node scripts/ui-acceptance.mjs http://localhost:4310

      - name: Full API and page audit
        run: pnpm run audit http://localhost:4310

      - name: Upload UI evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-acceptance-evidence
          path: screenshots/
          retention-days: 7

      - name: Stop production server
        if: always()
        run: |
          if [ -f e2e-server.pid ]; then
            kill -- -"$(cat e2e-server.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Compose graph
        run: docker compose --profile full config --quiet

      - name: Build migration image
        run: docker build --target migrate --tag worldloom-migrate:ci .

      - name: Build production image
        run: |
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" \
            --build-arg VERSION="$GITHUB_SHA" \
            --tag worldloom:ci .
          revision="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' worldloom:ci)"
          test "$revision" = "$GITHUB_SHA"

      - name: Full Compose runtime smoke test
        run: |
          set -eu
          cleanup() {
            docker compose --profile full down -v --remove-orphans
          }
          trap cleanup EXIT
          docker compose --profile full up -d --build
          for attempt in $(seq 1 60); do
            app_status="$(docker inspect --format '{{.State.Health.Status}}' worldloom-app 2>/dev/null || true)"
            worker_status="$(docker inspect --format '{{.State.Health.Status}}' worldloom-worker 2>/dev/null || true)"
            if [ "$app_status" = healthy ] && [ "$worker_status" = healthy ]; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose --profile full ps
              docker compose --profile full logs --no-color --tail=120
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4310/api/health
          docker compose --profile full ps
